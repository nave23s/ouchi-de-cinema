<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&family=Cormorant+Garamond:ital,wght@1,700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4; --tx:#1a1510; --sub:#4a4030; --dim:#8a7c68;
    --gold:#9a6c10; --gb:#c08c28; --acc:#c05a10;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:var(--bg);
    font-family:'Noto Serif JP',serif;
    position:relative;
  }
  .bg{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse 80% 60% at 50% 28%, rgba(192,90,16,.10) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 18% 85%, rgba(154,108,16,.09) 0%, transparent 50%),
      radial-gradient(ellipse 50% 50% at 85% 70%, rgba(30,112,64,.06) 0%, transparent 50%);
  }
  .filmstrip{
    position:absolute; left:0; right:0; height:6px;
    background: repeating-linear-gradient(90deg, var(--gold) 0px, var(--gold) 8px, transparent 8px, transparent 16px);
    opacity:.25;
  }
  .filmstrip.top{top:0;}
  .filmstrip.bottom{bottom:0;}
  .content{
    position:relative; z-index:1;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
  }
  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:18px; color:var(--acc);
    letter-spacing:.22em; text-transform:uppercase;
    margin-bottom:28px;
    display:flex; align-items:center; gap:18px;
  }
  .eyebrow::before, .eyebrow::after{
    content:''; width:60px; height:1px;
    background:linear-gradient(90deg, transparent, var(--acc));
  }
  .eyebrow::after{ transform:scaleX(-1); }
  .title{
    font-family:'Noto Serif JP',serif;
    font-weight:600;
    font-size:92px; line-height:1.05;
    color:var(--tx);
    margin-bottom:6px;
    letter-spacing:.02em;
  }
  .title em{
    font-family:'Cormorant Garamond',serif;
    font-style:italic; font-weight:700;
    font-size:148px; line-height:1;
    background:linear-gradient(135deg, var(--gold), var(--gb));
    -webkit-background-clip:text; background-clip:text;
    color:transparent;
    margin-left:10px;
    display:inline-block;
  }
  .tagline{
    font-family:'Cormorant Garamond',serif;
    font-style:italic; font-size:36px;
    color:var(--sub);
    margin-top:18px;
  }
  .url{
    font-family:'JetBrains Mono',monospace;
    font-size:20px; color:var(--dim);
    letter-spacing:.1em;
    margin-top:46px;
  }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="filmstrip top"></div>
  <div class="filmstrip bottom"></div>
  <div class="content">
    <div class="eyebrow">Japan's Premier Home Cinema Review</div>
    <div class="title">オウチ de<em>CINEMA</em></div>
    <div class="tagline">観たい！と思わせることだけを目指して。</div>
    <div class="url">ouchi-de-cinema.com</div>
  </div>
</body>
</html>
